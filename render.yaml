# Render.com blueprint — deploy the student portal as a Docker web service.
# In Render: New + → Blueprint → connect your GitHub repo → it reads this file.
services:
  - type: web
    name: edupath-portal
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false                  # set your own in the Render dashboard
      - key: MONGODB_URI
        sync: false                  # paste your MongoDB Atlas connection string
      - key: MONGODB_DB
        value: edupath               # database name inside the cluster
      - key: LLM_PROVIDER
        value: none                  # set to 'anthropic' or 'openai' to enable AI
      - key: LLM_API_KEY
        sync: false                  # paste your own API key in the dashboard
