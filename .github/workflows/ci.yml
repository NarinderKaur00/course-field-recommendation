name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: Build models & run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r portal/requirements.txt pytest

      - name: Build dataset & train models
        run: |
          python portal/build_thapar_dataset.py
          python portal/train_models.py

      - name: Run tests
        working-directory: portal
        run: pytest -q

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f Dockerfile.web -t edupath-portal:ci .
